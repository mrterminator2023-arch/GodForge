<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64" shape-rendering="crispEdges">
<defs>
 <radialGradient id="bg" cx="50%" cy="60%" r="70%">
  <stop offset="0" stop-color="#3a1d0e"/><stop offset="0.55" stop-color="#1a0f12"/><stop offset="1" stop-color="#0b0810"/>
 </radialGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff6a1a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
 </radialGradient>
</defs>
<rect width="64" height="64" fill="url(#bg)"/>
<!-- glow -->
<circle cx="32" cy="34" r="20" fill="url(#glow)" shape-rendering="auto"/>

<!-- anvil (pixel) -->
<g fill="#4a4f5c">
 <rect x="14" y="36" width="36" height="5"/>
 <rect x="10" y="37" width="4" height="4"/>  <!-- horn -->
 <rect x="8" y="38" width="2" height="2"/>
 <rect x="20" y="41" width="24" height="3"/>
 <rect x="24" y="44" width="16" height="6"/>
 <rect x="18" y="50" width="28" height="4"/>
</g>
<g fill="#6b7180"> <!-- highlights -->
 <rect x="14" y="36" width="36" height="1"/>
 <rect x="10" y="37" width="4" height="1"/>
 <rect x="18" y="50" width="28" height="1"/>
</g>
<g fill="#2b2f38"> <!-- shadows -->
 <rect x="14" y="40" width="36" height="1"/>
 <rect x="20" y="43" width="24" height="1"/>
 <rect x="18" y="53" width="28" height="1"/>
</g>

<!-- glowing world cube on anvil -->
<g>
 <!-- top face -->
 <polygon points="32,20 40,24 32,28 24,24" fill="#7ee36a"/>
 <!-- left face -->
 <polygon points="24,24 32,28 32,36 24,32" fill="#3f8fd8"/>
 <!-- right face -->
 <polygon points="40,24 32,28 32,36 40,32" fill="#2c66a8"/>
 <!-- pixel details on top: land/water -->
 <rect x="30" y="22" width="2" height="1" fill="#3f8fd8"/>
 <rect x="33" y="24" width="3" height="1" fill="#3f8fd8"/>
 <rect x="28" y="25" width="2" height="1" fill="#3f8fd8"/>
 <rect x="31" y="26" width="2" height="1" fill="#e8d98a"/>
 <!-- edges glow -->
 <polyline points="24,24 32,20 40,24" fill="none" stroke="#fff3b0" stroke-width="0.6"/>
 <polyline points="24,24 32,28 40,24" fill="none" stroke="#c9f7c0" stroke-width="0.5"/>
 <line x1="32" y1="28" x2="32" y2="36" stroke="#9cc9ff" stroke-width="0.5"/>
 <!-- molten seam at bottom -->
 <rect x="24" y="32" width="8" height="1" fill="#ff9a2e" opacity="0.9"/>
 <rect x="32" y="32" width="8" height="1" fill="#ff7a1a" opacity="0.9"/>
</g>

<!-- hammer -->
<g>
 <!-- handle -->
 <polygon points="44,12 46,10 58,22 56,24" fill="#8b5a2b"/>
 <polygon points="45,11 46,10 58,22 57,23" fill="#b8814a"/>
 <!-- head -->
 <rect x="38" y="6" width="10" height="8" fill="#8f96a6"/>
 <rect x="38" y="6" width="10" height="2" fill="#c3c9d6"/>
 <rect x="38" y="12" width="10" height="2" fill="#5d6373"/>
 <rect x="36" y="8" width="2" height="4" fill="#5d6373"/>
 <rect x="48" y="7" width="1" height="6" fill="#5d6373"/>
</g>

<!-- sparks -->
<g fill="#ffd166">
 <rect x="20" y="16" width="1" height="1"/><rect x="18" y="20" width="1" height="1"/>
 <rect x="42" y="18" width="1" height="1"/><rect x="45" y="27" width="1" height="1"/>
 <rect x="22" y="30" width="1" height="1"/><rect x="26" y="14" width="1" height="1"/>
 <rect x="36" y="16" width="1" height="1"/>
</g>
<g fill="#ff7a1a">
 <rect x="16" y="24" width="1" height="1"/><rect x="47" y="22" width="1" height="1"/>
 <rect x="40" y="14" width="1" height="1"/><rect x="21" y="26" width="1" height="1"/>
 <rect x="44" y="33" width="1" height="1"/>
</g>
<g fill="#fff8e0">
 <rect x="35" y="19" width="1" height="1"/><rect x="29" y="18" width="1" height="1"/>
 <rect x="43" y="23" width="1" height="1"/>
</g>

<!-- embers under anvil -->
<g fill="#ff6a1a">
 <rect x="12" y="55" width="1" height="1"/><rect x="50" y="56" width="1" height="1"/>
 <rect x="30" y="56" width="1" height="1"/><rect x="40" y="57" width="1" height="1"/>
</g>
<!-- ground -->
<rect x="0" y="54" width="64" height="10" fill="#120b0c" opacity="0.7"/>
<rect x="0" y="54" width="64" height="1" fill="#2a1a12"/>
</svg>
</body></html>
